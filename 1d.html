<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>

<body>

    <h2>Click the buttons below:</h2>

    <button id="btn1">Button 1</button>
    <button id="btn2">Button 2</button>
    <button id="btn3">Button 3</button>

    <p id="output"></p>

    <script>
        // Get reference to the output paragraph
        const output = document.getElementById("output");

        // Handle click for Button 1
        document.getElementById("btn1").addEventListener("click", function() {
            output.innerText = "B.Tech III Year CSE";
        });

        // Handle click for Button 2
        document.getElementById("btn2").addEventListener("click", function() {
            output.innerText = "Computer Science and Engineering";
        });

        // Handle click for Button 3
        document.getElementById("btn3").addEventListener("click", function() {
            output.innerText = "Full Stack Development - II";
        });
    </script>

</body>
</html>
